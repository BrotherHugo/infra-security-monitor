# Goreleaser on tag push v* (tag is created by go-semantic-release in main.yml).
# Also: workflow_dispatch for manual re-runs when tag-push did not trigger.

name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: true
        type: string

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.6.1
          args: release --clean --skip=archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
